  name: Build EXE
  on:
    workflow_dispatch:
    push:
  jobs:
    build:
      runs-on: windows-latest
      defaults:
        run:
          working-directory: GITHUB_UPLOAD
      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-python@v5
          with:
            python-version: "3.11"
        - run: pip install -r requirements.txt
        - run: pyinstaller --noconfirm --onefile --windowed --name saf1rkaboost main.py
        - uses: actions/upload-artifact@v4
          with:
            name: saf1rkaboost-exe
            path: GITHUB_UPLOAD/dist/saf1rkaboost.exe
